# Ada — stateful services. Run these in Docker; run backend + frontend on the host
# during dev for instant hot-reload. `docker compose up -d` and leave them running.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ada-postgres
    environment:
      POSTGRES_USER: ada
      POSTGRES_PASSWORD: ada_dev
      POSTGRES_DB: ada
    ports:
      - "5432:5432"
    volumes:
      - ada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ada"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ada-redis
    ports:
      - "6379:6379"
    volumes:
      - ada_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ada-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ada_qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  ada_pgdata:
  ada_redisdata:
  ada_qdrantdata:
